grafana:
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false
prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests: {cpu: 150m, memory: 512Mi}
      limits: {cpu: 750m, memory: 1536Mi}
