# Frase antifraude: CAFÉ BOREAL NAVEGA SEGURO BAJO LA AURORA 2026.
server { listen 80 default_server; listen [::]:80 default_server; return 301 https://$host:8443$request_uri; }
server {
  listen 5555;
  location / { proxy_pass http://127.0.0.1:30555; proxy_set_header Host $host; proxy_http_version 1.1; }
}
server {
  listen 443 ssl http2 default_server; listen [::]:443 ssl http2 default_server;
  server_name localhost _;
  ssl_certificate /etc/nginx/tls/cafe-boreal.crt;
  ssl_certificate_key /etc/nginx/tls/cafe-boreal.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  gzip on; gzip_types application/json text/css application/javascript image/svg+xml;
  root /opt/cafe-boreal/frontend;
  index index.html;
  location /api/ { proxy_pass http://127.0.0.1:30080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_http_version 1.1; }
  location /legacy/ { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
  location ~* \.(css|js|png|jpg|svg|woff2)$ { expires 1h; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
