apiVersion: v1
kind: ConfigMap
metadata: {name: database-schema, namespace: cafe-boreal}
data:
  schema.sql: |
    CREATE TABLE IF NOT EXISTS products (
      id BIGSERIAL PRIMARY KEY, nombre VARCHAR(120) NOT NULL,
      precio NUMERIC(12,2) NOT NULL CHECK(precio > 0), stock INTEGER NOT NULL CHECK(stock >= 0),
      descripcion TEXT NOT NULL DEFAULT '', imagen TEXT NOT NULL DEFAULT '', created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS customers (
      id BIGSERIAL PRIMARY KEY, nombre VARCHAR(120) NOT NULL, email VARCHAR(254) NOT NULL UNIQUE,
      identity_ciphertext TEXT NOT NULL, key_version INTEGER NOT NULL DEFAULT 1, created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE TABLE IF NOT EXISTS orders (
      id BIGSERIAL PRIMARY KEY, customer_id BIGINT NOT NULL REFERENCES customers(id),
      items JSONB NOT NULL, total NUMERIC(12,2) NOT NULL CHECK(total >= 0), created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS idx_orders_customer ON orders(customer_id);
---
apiVersion: batch/v1
kind: Job
metadata: {name: database-schema-v1, namespace: cafe-boreal}
spec:
  backoffLimit: 8
  template:
    metadata: {labels: {app: database-schema}}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: postgres:16-alpine
        envFrom: [{secretRef: {name: database-secret}}]
        command: [sh, -c, 'until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 2; done; PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /schema/schema.sql']
        volumeMounts: [{name: schema, mountPath: /schema}]
      volumes: [{name: schema, configMap: {name: database-schema}}]
