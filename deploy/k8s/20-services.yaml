apiVersion: v1
kind: ConfigMap
metadata: {name: api-config, namespace: cafe-boreal}
data:
  DATABASE_URL: postgresql://cafeboreal:CHANGE_AT_RUNTIME@postgres:5432/cafeboreal
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: cafe-boreal}
spec:
  replicas: 1
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: cafe-boreal-api:local
        imagePullPolicy: Never
        env: [{name: SERVICE_NAME, value: catalog}, {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: app-secret, key: database-url}}}, {name: IDENTITY_KEY_B64, valueFrom: {secretKeyRef: {name: app-secret, key: identity-key}}}]
        ports: [{name: http, containerPort: 8000}]
        readinessProbe: {httpGet: {path: /api/catalog/healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /api/catalog/healthz, port: http}, initialDelaySeconds: 180, periodSeconds: 10, failureThreshold: 6}
        resources: {requests: {cpu: 75m, memory: 96Mi}, limits: {cpu: 400m, memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: orders, namespace: cafe-boreal}
spec:
  replicas: 1
  selector: {matchLabels: {app: orders}}
  template:
    metadata: {labels: {app: orders}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: cafe-boreal-api:local
        imagePullPolicy: Never
        env: [{name: SERVICE_NAME, value: orders}, {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: app-secret, key: database-url}}}, {name: IDENTITY_KEY_B64, valueFrom: {secretKeyRef: {name: app-secret, key: identity-key}}}]
        ports: [{name: http, containerPort: 8000}]
        readinessProbe: {httpGet: {path: /api/orders/healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /api/orders/healthz, port: http}, initialDelaySeconds: 180, periodSeconds: 10, failureThreshold: 6}
        resources: {requests: {cpu: 75m, memory: 96Mi}, limits: {cpu: 400m, memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: customers, namespace: cafe-boreal}
spec:
  replicas: 1
  selector: {matchLabels: {app: customers}}
  template:
    metadata: {labels: {app: customers}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: api
        image: cafe-boreal-api:local
        imagePullPolicy: Never
        env: [{name: SERVICE_NAME, value: customers}, {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: app-secret, key: database-url}}}, {name: IDENTITY_KEY_B64, valueFrom: {secretKeyRef: {name: app-secret, key: identity-key}}}]
        ports: [{name: http, containerPort: 8000}]
        readinessProbe: {httpGet: {path: /api/customers/healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /api/customers/healthz, port: http}, initialDelaySeconds: 180, periodSeconds: 10, failureThreshold: 6}
        resources: {requests: {cpu: 75m, memory: 96Mi}, limits: {cpu: 400m, memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: catalog, namespace: cafe-boreal, labels: {app: catalog}}
spec: {selector: {app: catalog}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: cafe-boreal, labels: {app: orders}}
spec: {selector: {app: orders}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: customers, namespace: cafe-boreal, labels: {app: customers}}
spec: {selector: {app: customers}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cafe-boreal-api
  namespace: cafe-boreal
  annotations: {nginx.ingress.kubernetes.io/proxy-body-size: 1m}
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - {path: /api/catalog, pathType: Prefix, backend: {service: {name: catalog, port: {number: 80}}}}
      - {path: /api/orders, pathType: Prefix, backend: {service: {name: orders, port: {number: 80}}}}
      - {path: /api/customers, pathType: Prefix, backend: {service: {name: customers, port: {number: 80}}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api-pdb, namespace: cafe-boreal}
spec: {minAvailable: 1, selector: {matchExpressions: [{key: app, operator: In, values: [catalog, orders, customers]}]}}
